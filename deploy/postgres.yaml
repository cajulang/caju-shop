# PostgreSQL 17 for development, in a local cluster (k3s, kind...): data in a volume, reachable
# only inside the cluster (a ClusterIP Service, never a port on every interface of the host).
# The password comes from a Secret you create first; nothing here has a password in it:
#   kubectl create namespace caju-shop
#   kubectl -n caju-shop create secret generic pg --from-literal=password="$(openssl rand -hex 24)"
#   kubectl apply -f deploy/postgres.yaml
# From your machine, through a tunnel on 127.0.0.1 only:
#   kubectl -n caju-shop port-forward svc/pg 55440:5432
#   DATABASE_URL="postgres://shop:$(kubectl -n caju-shop get secret pg -o jsonpath='{.data.password}' | base64 -d)@127.0.0.1:55440/shop"
apiVersion: v1
kind: Namespace
metadata: { name: caju-shop }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: pg-data, namespace: caju-shop }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: pg, namespace: caju-shop }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: pg } }
  template:
    metadata: { labels: { app: pg } }
    spec:
      containers:
        - name: pg
          image: postgres:17-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: shop }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: pg, key: password } }
            - { name: POSTGRES_DB, value: shop }
            - { name: POSTGRES_INITDB_ARGS, value: --auth=scram-sha-256 }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: [pg_isready, -U, shop, -d, shop] }
            periodSeconds: 2
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: pg-data }
---
apiVersion: v1
kind: Service
metadata: { name: pg, namespace: caju-shop }
spec:
  type: ClusterIP
  selector: { app: pg }
  ports: [{ port: 5432, targetPort: 5432 }]
